name: Generation eval

# Scores 20 representative generation scenarios through the REAL fan-out path
# and fails if generation quality regressed against eval-baseline/reference.json.
#
# Why this exists: [GQ-13] built the harness, but nothing ran it on a schedule —
# it only ever ran when someone suspected a problem, and it always exits 0. So
# the 2026-09-07 failures (named movements silently substituted, Wendler set
# ladders truncated to two sets, loads computed off the wrong training max)
# reached production and were caught by the owner eyeballing his own week.
# Every one of them scores 0-40% on scenarios that now exist. This turns
# "Rich notices a bad week" into a red run.
#
# Setup required before it can do anything (the job no-ops with a notice until
# both are present):
#   ANTHROPIC_API_KEY   — the eval makes real LLM calls.
#   EVAL_DATABASE_URL   — a database with the exercise catalog and a users row
#                         matching the EVAL_USER_ID set below.
#
# IMPORTANT: do NOT point EVAL_DATABASE_URL at production. The eval persists no
# workouts, but generation telemetry (llm_generation_logs) IS written for the
# eval user, so a prod URL would pollute prod's LLM metrics with 20 synthetic
# generations a week. A Neon branch off prod is the right target: same catalog,
# isolated writes, thrown away whenever you like.
#
# Cost: one run is ~20 full weekly generations (Haiku day calls, Sonnet
# planning on the override scenarios). Use the `only` input for a cheap probe.
#
# When it runs:
#   - on a PR that touches a file shaping what the model emits (see `paths`
#     below) — this is the high-value trigger. Every prompt edit is a chance to
#     help one case and break another, which is exactly the 2026-09-07 shape:
#     the mean barely moved while one scenario collapsed. Catching that before
#     merge beats finding it the following Monday.
#   - Mondays, as a backstop for drift no PR explains: a new model version
#     under us, catalog changes, slow decay.
#   - manually, for a cheap single-scenario probe.
# Add the `skip-eval` label to a PR to opt out (e.g. a comment-only change to a
# listed file).
#
# Re-capturing eval-baseline/reference.json: dispatch this workflow with
# repeat=3 and commit the artifact's run file as the new reference. Do it HERE
# rather than locally — the reference must be captured against
# EVAL_DATABASE_URL's catalog, or its scores aren't comparable with CI's. The
# committed reference is a single run from 2026-09-07, so each scenario's number
# is wherever that one sample happened to land (muscle-balance-6day sits at
# 100%, the top of its range). Confirmation absorbs most of that bias; a median
# reference would remove the rest. Cost: scenarios × 3 generations.
#
# Two-stage verdict (2026-09-22): the first gate pass is SOFT — it names the
# scenarios that look regressed but never fails. Those are then re-run twice and
# the final gate judges each on the MEDIAN of its samples. Generation is
# stochastic and the scores are quantized (muscle-balance-6day moves in ~11pt
# steps and spanned 67-100% across three runs of untouched main), so a single
# sample against a 15pt allowance fired on noise about half the time. Widening
# the allowance was the wrong fix — it would blind the gate to the 2026-09-07
# shape, where the mean barely moved while one scenario collapsed.

on:
  schedule:
    # Mondays 12:00 UTC (07:00 Central) — a fresh number at the start of the
    # week, before the owner regenerates his own plan.
    - cron: "0 12 * * 1"
  # Only the files that can change what the model emits. Deliberately NOT
  # every source file: a run costs real tokens, so unrelated PRs must not pay
  # for one. Test files are excluded — they cannot alter generation output.
  pull_request:
    paths:
      - "src/utils/fanout-prompt-generator.ts"
      - "src/utils/prompt-generator.ts"
      - "src/utils/post-generation-validation.ts"
      - "src/utils/constraint-enforcement.ts"
      - "src/utils/limitation-validation.ts"
      - "src/utils/equipment-validation.ts"
      - "src/utils/equipment-per-day-enforcement.ts"
      - "src/utils/duration-enforcement.ts"
      - "src/utils/workout-balance-validation.ts"
      - "src/utils/percent-scheme-loads.ts"
      - "src/utils/requested-exercises.ts"
      - "src/utils/exercise-name-resolution.ts"
      - "src/utils/muscle-load.ts"
      - "src/utils/weekday-constraint-compliance.ts"
      - "src/utils/generation-response-validation.ts"
      - "src/utils/plan-schedule.ts"
      - "src/utils/job-reconciliation.ts"
      - "src/services/workout-agent.service.ts"
      - "src/services/exercise.service.ts"
      - "src/constants/access-policy.ts"
      # The harness and the line it grades against.
      - "src/scripts/eval-generation.ts"
      - "src/scripts/eval-scenarios.ts"
      - "src/utils/generation-compliance.ts"
      - "src/utils/eval-gate.ts"
      - "eval-baseline/reference.json"
      - ".github/workflows/eval-generation.yml"
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated scenario ids (blank = all)"
        required: false
        default: ""
      concurrency:
        description: "Scenarios in flight at once"
        required: false
        default: "3"
      label:
        description: "Run label (names the artifact)"
        required: false
        default: ""
      repeat:
        description: "Runs per scenario; the median is scored. Use 3 to capture a new reference."
        required: false
        default: "1"

# One eval at a time per PR (or per branch for the cron), so concurrent runs
# don't race on the same LLM rate limits and produce noisy scores. A new push
# to a PR supersedes its in-flight run — no point paying for a score of code
# that has already been replaced. Scheduled runs are never cancelled.
concurrency:
  group: generation-eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  eval:
    name: Score generation quality
    runs-on: ubuntu-latest
    if: "!contains(github.event.pull_request.labels.*.name, 'skip-eval')"
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DATABASE_URL: ${{ secrets.EVAL_DATABASE_URL }}
      # Prod parity: the planning call escalates to Sonnet for override
      # requests in production, and the reference was captured that way.
      SONNET_PLANNING_ON_OVERRIDE: "true"
      # The eval attributes its generations to this users row: the harness
      # passes it to generateWeeklyWorkout, and llm_generation_logs.user_id has
      # a foreign key to users. It must EXIST in whatever database
      # EVAL_DATABASE_URL points at, or every telemetry insert fails. The
      # harness defaults to 1, which exists in a local dev DB but NOT in prod
      # (lowest prod id is 3) — so a Neon branch off prod needs this set.
      EVAL_USER_ID: "3"
      # Inert but required by modules that read them at load time.
      JWT_SECRET: eval-only-not-a-real-credential
      RESEND_API_KEY: re_eval_only_not_a_real_key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Check required secrets
        id: cfg
        run: |
          missing=""
          [ -z "$ANTHROPIC_API_KEY" ] && missing="$missing ANTHROPIC_API_KEY"
          [ -z "$DATABASE_URL" ] && missing="$missing EVAL_DATABASE_URL"
          if [ -n "$missing" ]; then
            echo "::notice::Generation eval skipped — missing secret(s):$missing. See the comments in .github/workflows/eval-generation.yml."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve run label
        if: steps.cfg.outputs.ready == 'true'
        id: label
        run: |
          label="${{ github.event.inputs.label }}"
          if [ -z "$label" ] && [ -n "${{ github.event.pull_request.number }}" ]; then
            label="pr-${{ github.event.pull_request.number }}"
          fi
          [ -z "$label" ] && label="eval-$(date -u +%Y-%m-%d)"
          echo "label=$label" >> "$GITHUB_OUTPUT"

      # Writes eval-runs/<label>.json. Always exits 0 — the gate below is what
      # decides pass/fail, so the report is captured even on a regression.
      - name: Run eval scenarios
        if: steps.cfg.outputs.ready == 'true'
        run: >-
          npm run eval-generation --
          --label "${{ steps.label.outputs.label }}"
          --concurrency "${{ github.event.inputs.concurrency || '3' }}"
          --repeat "${{ github.event.inputs.repeat || '1' }}"
          ${{ github.event.inputs.only && format('--only {0}', github.event.inputs.only) || '' }}

      # Stage 1 of 2 — SOFT. Generation is stochastic, so one run is a sample,
      # not a measurement: muscle-balance-6day scored 67/100/89 across three
      # runs on an untouched main, while the allowance is 15pt. Failing here
      # would red-flag PRs at roughly a coin flip. Instead this names the
      # suspect scenarios and always exits 0; the confirm stage decides.
      - name: Gate (soft) — identify suspect scenarios
        if: steps.cfg.outputs.ready == 'true'
        id: softgate
        run: >-
          npm run eval-gate --
          --current "eval-runs/${{ steps.label.outputs.label }}.json"
          --soft

      # Only a suspected regression pays for extra generations — a passing PR
      # costs exactly what it did before this stage existed.
      - name: Re-run suspect scenarios
        if: steps.cfg.outputs.ready == 'true' && steps.softgate.outputs.confirm != ''
        run: >-
          npm run eval-generation --
          --label "${{ steps.label.outputs.label }}-confirm"
          --only "${{ steps.softgate.outputs.confirm }}"
          --repeat 2
          --concurrency "${{ github.event.inputs.concurrency || '3' }}"

      # Stage 2 of 2 — the authoritative verdict. With --confirm, each re-run
      # scenario is judged on the median of all its samples (the original run
      # counts as evidence too, so it's a median of three).
      - name: Gate against the committed reference
        if: steps.cfg.outputs.ready == 'true'
        run: >-
          npm run eval-gate --
          --current "eval-runs/${{ steps.label.outputs.label }}.json"
          ${{ steps.softgate.outputs.confirm != '' && format('--confirm eval-runs/{0}-confirm.json', steps.label.outputs.label) || '' }}

      # Uploaded even when the gate fails — the per-check detail is how you see
      # WHICH check moved, which the summary table doesn't show.
      - name: Upload run summary
        if: always() && steps.cfg.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ steps.label.outputs.label }}
          path: eval-runs/*.json
          if-no-files-found: warn
          retention-days: 90
